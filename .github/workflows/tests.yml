name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: go test -cover ./...
      - run: go vet ./...
      - run: go build -trimpath -o bin/stockllama${{ runner.os == 'Windows' && '.exe' || '' }} .
